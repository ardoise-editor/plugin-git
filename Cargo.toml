[package]
name = "simpleedit-git"
version = "1.2.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Git plugin of SimpleEdit"
license = "MIT"

[[bin]]
name = "git"
path = "src/main.rs"

[dependencies]
simpleedit-plugin = { git = "https://github.com/simple-edit-app/plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
tempfile = "3"
similar = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "fs", "macros", "process", "io-util"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
